[project]
name = "net-preset"
version = "0.1.0"
description = "Named IPv4 profiles for a Windows Ethernet adapter"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
net-preset = "net_preset.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/net_preset"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
